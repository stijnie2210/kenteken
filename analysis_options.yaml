include: package:lints/recommended.yaml

analyzer:
  # A Flutter app with its own dependencies and analysis options.
  exclude:
    - example/app/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - public_member_api_docs
    - unawaited_futures
